name: Ziggo Spam Cleanup v6

on:
  schedule:
    # Ieder uur opruimen
    - cron: "0 * * * *" # force trigger registration

    # Dagrapport versturen (23:00 UTC)
    - cron: "0 23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:


cleanup:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Reports branch ophalen (worktree)
        run: |
          git fetch origin reports:reports || true
          if git show-ref --verify --quiet refs/heads/reports
          then
            git worktree add reports-branch reports
          else
            git worktree add -b reports reports-branch
          fi
          mkdir -p reports-branch/reports
          rm -rf reports
          ln -s reports-branch/reports reports

      - name: Cleanup uitvoeren
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          WP_REPORT_URL: ${{ secrets.WP_REPORT_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}
        run: |
          python imap_cleanup.py

      - name: Wijzigingen committen
        run: |
          cd reports-branch
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports/
          if git diff --cached --quiet
          then
            echo "Geen wijzigingen."
          else
            git commit -m "Update cleanup report"
            git push origin reports
          fi
